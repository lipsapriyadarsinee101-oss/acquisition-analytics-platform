name: Validate analytics platform
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m portfolio_analytics demo --project demo-build
      - run: python -m portfolio_analytics.predictive --report preview/report.json --output demo-build/predictive.json
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-portfolio-report
          path: |
            demo-build/lakehouse/runs/
            demo-build/predictive.json
          retention-days: 7
